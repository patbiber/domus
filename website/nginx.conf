# Statische Auslieferung von biber-solar (Arbeitskopie unter ./site)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Git-Daten und Repo-Interna nicht ausliefern
    location ~ /\.            { return 404; }
    location = /CLAUDE.md     { return 404; }
    location = /package.json  { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
