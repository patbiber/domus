
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


# Strompreis GWS + Fronius-Livewerte vom Energie-Dienst (domus/energie, Port 8099)
rest:
  - resource: http://127.0.0.1:8099/api/status
    scan_interval: 30
    sensor:
      - name: Strompreis Bezug
        unique_id: gws_strompreis_bezug
        value_template: "{{ value_json.tarif.bezug_chf_kwh }}"
        availability: "{{ value_json.tarif is not none }}"
        unit_of_measurement: CHF/kWh
        icon: mdi:cash-minus
      - name: Rückliefervergütung
        unique_id: gws_rueckliefer_verguetung
        value_template: "{{ value_json.tarif.rueckliefer_chf_kwh }}"
        availability: "{{ value_json.tarif is not none }}"
        unit_of_measurement: CHF/kWh
        icon: mdi:cash-plus
      - name: Stromkosten aktuell
        unique_id: domus_stromkosten_aktuell
        value_template: "{{ value_json.kosten_chf_h }}"
        availability: "{{ value_json.fronius_ok }}"
        unit_of_measurement: CHF/h
        icon: mdi:cash-clock
      - name: Einspeiseerlös aktuell
        unique_id: domus_einspeiseerloes_aktuell
        value_template: "{{ value_json.erloes_chf_h }}"
        availability: "{{ value_json.fronius_ok }}"
        unit_of_measurement: CHF/h
        icon: mdi:solar-power
      - name: Börsenpreis Day-Ahead
        unique_id: domus_boersenpreis_day_ahead
        value_template: "{{ value_json.boerse.rp_kwh }}"
        availability: "{{ value_json.boerse is not none and value_json.boerse.rp_kwh is not none }}"
        unit_of_measurement: Rp/kWh
        state_class: measurement
        icon: mdi:chart-line
        json_attributes_path: "$.boerse"
        json_attributes:
          - eur_mwh
          - min_rp_kwh
          - max_rp_kwh
          - naechster_negativer
          - kurs_eur_chf
      - name: Börsenpreis Day-Ahead CHF
        unique_id: domus_boersenpreis_chf
        value_template: "{{ (value_json.boerse.rp_kwh / 100) | round(4) }}"
        availability: "{{ value_json.boerse is not none and value_json.boerse.rp_kwh is not none }}"
        unit_of_measurement: CHF/kWh
        state_class: measurement
        icon: mdi:chart-line
      - name: homi-Server Leistung
        unique_id: homi_server_leistung
        value_template: "{{ value_json.server.leistung_w }}"
        availability: "{{ value_json.server is defined and value_json.server.leistung_w is not none }}"
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:server
        device_class: power
      - name: homi-Server CPU
        unique_id: homi_server_cpu
        value_template: "{{ value_json.server.cpu_pct }}"
        availability: "{{ value_json.server is defined and value_json.server.cpu_pct is not none }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:cpu-64-bit
      - name: homi-Server RAM
        unique_id: homi_server_ram
        value_template: "{{ value_json.server.ram_pct }}"
        availability: "{{ value_json.server is defined and value_json.server.ram_pct is not none }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:memory
      - name: homi-Server Disk
        unique_id: homi_server_disk
        value_template: "{{ value_json.server.disk_pct }}"
        availability: "{{ value_json.server is defined and value_json.server.disk_pct is not none }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:harddisk
      - name: homi-Server Temperatur
        unique_id: homi_server_temp
        value_template: "{{ value_json.server.temp_c }}"
        availability: "{{ value_json.server is defined and value_json.server.temp_c is not none }}"
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:thermometer
        device_class: temperature
      - name: homi-Server Warnungen
        unique_id: homi_server_warnungen
        value_template: "{{ value_json.server.warnungen | default([]) | join(' · ') or 'keine' }}"
        availability: "{{ value_json.server is defined }}"
        icon: mdi:alert-circle-outline
        json_attributes_path: "$.server"
        json_attributes: [warnungen, cpu_hoch_min, ram_pct, disk_pct, cpu_pct, uptime_s]
    binary_sensor:
      - name: homi-Server Warnung
        unique_id: homi_server_warnung
        value_template: "{{ value_json.server.warnungen | default([]) | length > 0 }}"
        availability: "{{ value_json.server is defined }}"
        device_class: problem
      - name: Börsenpreis negativ
        unique_id: domus_boersenpreis_negativ
        value_template: "{{ value_json.boerse.negativ }}"
        availability: "{{ value_json.boerse is not none }}"
        icon: mdi:cash-remove
  - resource: http://127.0.0.1:8099/api/speicher
    scan_interval: 60
    sensor:
      - name: Speicher-Simulation Steckerspeicher 2 kWh Ersparnis
        unique_id: domus_sim_stecker_2kwh_ersparnis
        value_template: "{{ value_json.speicher[0].summe.ersparnis_chf }}"
        unit_of_measurement: CHF
        state_class: total_increasing
        icon: mdi:battery-charging-high
        json_attributes_path: "$.speicher[0]"
        json_attributes:
          - soc_pct
          - heute
          - summe
          - tage_gemessen
          - zyklen
          - autarkie_plus_pct
          - ersparnis_pro_jahr_chf
      - name: Speicher-Simulation Steckerspeicher 2 kWh Ladestand
        unique_id: domus_sim_stecker_2kwh_soc
        value_template: "{{ value_json.speicher[0].soc_pct }}"
        unit_of_measurement: "%"
        state_class: measurement
        device_class: battery
      - name: Speicher-Simulation Speicher 5 kWh Ersparnis
        unique_id: domus_sim_speicher_5kwh_ersparnis
        value_template: "{{ value_json.speicher[1].summe.ersparnis_chf }}"
        unit_of_measurement: CHF
        state_class: total_increasing
        icon: mdi:battery-charging-high
        json_attributes_path: "$.speicher[1]"
        json_attributes:
          - soc_pct
          - heute
          - summe
          - tage_gemessen
          - zyklen
          - autarkie_plus_pct
          - ersparnis_pro_jahr_chf
      - name: Speicher-Simulation Speicher 5 kWh Ladestand
        unique_id: domus_sim_speicher_5kwh_soc
        value_template: "{{ value_json.speicher[1].soc_pct }}"
        unit_of_measurement: "%"
        state_class: measurement
        device_class: battery
      - name: Speicher-Simulation Speicher 10 kWh Ersparnis
        unique_id: domus_sim_speicher_10kwh_ersparnis
        value_template: "{{ value_json.speicher[2].summe.ersparnis_chf }}"
        unit_of_measurement: CHF
        state_class: total_increasing
        icon: mdi:battery-charging-high
        json_attributes_path: "$.speicher[2]"
        json_attributes:
          - soc_pct
          - heute
          - summe
          - tage_gemessen
          - zyklen
          - autarkie_plus_pct
          - ersparnis_pro_jahr_chf
      - name: Speicher-Simulation Speicher 10 kWh Ladestand
        unique_id: domus_sim_speicher_10kwh_soc
        value_template: "{{ value_json.speicher[2].soc_pct }}"
        unit_of_measurement: "%"
        state_class: measurement
        device_class: battery
  - resource: http://127.0.0.1:8099/api/prognose
    scan_interval: 1800
    sensor:
      - name: PV-Prognose heute
        unique_id: homi_pv_prognose_heute
        value_template: "{{ value_json.heute.kwh }}"
        availability: "{{ value_json.heute is defined }}"
        unit_of_measurement: kWh
        icon: mdi:solar-power-variant
        json_attributes_path: "$.heute"
        json_attributes: [rest_kwh, spitze_kw, wolken_pct, bestes_fenster]
      - name: PV-Prognose morgen
        unique_id: homi_pv_prognose_morgen
        value_template: "{{ value_json.morgen.kwh }}"
        availability: "{{ value_json.morgen is defined }}"
        unit_of_measurement: kWh
        icon: mdi:weather-sunny-alert
        json_attributes_path: "$.morgen"
        json_attributes: [datum, spitze_kw, wolken_pct, bestes_fenster]
      - name: PV-Prognose bestes Zeitfenster morgen
        unique_id: homi_pv_prognose_fenster_morgen
        value_template: "{{ (value_json.morgen.bestes_fenster.von ~ '–' ~ value_json.morgen.bestes_fenster.bis) if value_json.morgen.bestes_fenster else 'keins' }}"
        availability: "{{ value_json.morgen is defined }}"
        icon: mdi:washing-machine
  - resource: http://127.0.0.1:8099/api/boerse
    scan_interval: 900
    sensor:
      - name: Börsenpreise Prognose
        unique_id: domus_boersenpreise_prognose
        value_template: "{{ value_json.aktuell.min_rp_kwh if value_json.aktuell else none }}"
        unit_of_measurement: Rp/kWh
        icon: mdi:chart-timeline-variant
        json_attributes:
          - preise
          - quelle
  - resource: http://127.0.0.1:8099/api/amortisation
    scan_interval: 3600
    sensor:
      - name: PV-Anlage amortisiert
        unique_id: homi_amortisation_pct
        value_template: "{{ value_json.amortisiert_pct }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        unit_of_measurement: "%"
        icon: mdi:cash-check
        json_attributes: [bisher_chf, netto_chf, pro_jahr_chf, rest_chf, rest_jahre, break_even, inbetriebnahme, eigenverbrauch_pct, wert_rp_kwh, jahresertrag_kwh]
      - name: PV-Anlage Break-even
        unique_id: homi_amortisation_break_even
        value_template: "{{ value_json.break_even }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        device_class: date
        icon: mdi:calendar-check
  - resource: http://127.0.0.1:8099/api/einspeisung
    scan_interval: 900
    sensor:
      - name: Einspeisung dynamisch heute
        unique_id: homi_einspeisung_dynamisch_heute
        value_template: "{{ value_json.heute.einspeisung_dynamisch_chf }}"
        availability: "{{ value_json.heute is defined and value_json.heute }}"
        unit_of_measurement: CHF
        icon: mdi:transmission-tower-export
        json_attributes_path: "$.heute"
        json_attributes: [einspeisung_fix_chf, minuspreis_bloecke, ueberschuss_bei_minuspreis_kwh, kosten_bei_minuspreis_chf, batterie]
      - name: Minuspreise heute
        unique_id: homi_minuspreise_heute
        value_template: "{{ value_json.heute.minuspreis_bloecke | join(', ') if value_json.heute and value_json.heute.minuspreis_bloecke else 'keine' }}"
        icon: mdi:cash-minus
      - name: Minuspreise morgen
        unique_id: homi_minuspreise_morgen
        value_template: "{{ (value_json.morgen.minuspreis_bloecke | join(', ') if value_json.morgen.minuspreis_bloecke else 'keine') if value_json.morgen else 'noch offen' }}"
        icon: mdi:cash-minus
  - resource: http://127.0.0.1:8099/api/wochenbericht
    scan_interval: 3600
    sensor:
      - name: Wochenbericht Solarstrom
        unique_id: homi_woche_pv
        value_template: "{{ value_json.pv_kwh }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        unit_of_measurement: kWh
        icon: mdi:calendar-week
        json_attributes: [woche, titel, satz, verbrauch_kwh, einspeisung_kwh, bezug_kwh, autarkie_pct, eigenverbrauch_pct, erloes_chf, kosten_chf, bester_tag, vergleich, amortisation, batterie, tipp, minuspreis_stunden, vollstaendig_pct]
      - name: Wochenbericht Bilanz
        unique_id: homi_woche_bilanz
        value_template: "{{ value_json.saldo_chf }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        unit_of_measurement: CHF
        icon: mdi:cash-plus
  - resource: http://127.0.0.1:8099/api/steuerung
    scan_interval: 60
    sensor:
      - name: Fronius-Steuerung
        unique_id: homi_steuerung
        value_template: "{{ value_json.jetzt.wuerde }}"
        availability: "{{ value_json.modus | default('aus') != 'aus' }}"
        icon: mdi:solar-power-variant
        json_attributes: [modus, scharf_seit, schalter, regel, seit, auswertung_am, modbus, jetzt, summe, aktionen]
      - name: Fronius-Steuerung Modbus
        unique_id: homi_steuerung_modbus
        value_template: "{{ 'verbunden' if value_json.modbus.verbunden else 'getrennt' }}"
        icon: mdi:lan-connect
      - name: Fronius-Steuerung Begrenzung
        unique_id: homi_steuerung_begrenzung
        value_template: "{{ value_json.modbus.begrenzung_pct if value_json.modbus.begrenzung_aktiv else 100 }}"
        availability: "{{ value_json.modbus.verbunden | default(false) }}"
        unit_of_measurement: "%"
        icon: mdi:speedometer
      - name: Steuerungstest abgeregelt
        unique_id: homi_steuerung_test_kwh
        value_template: "{{ value_json.summe.abregeln_kwh | round(2) }}"
        unit_of_measurement: kWh
        icon: mdi:transmission-tower-off
      - name: Steuerungstest Kosten fixer Tarif
        unique_id: homi_steuerung_test_fix
        value_template: "{{ (0 - value_json.summe.verlust_fix_chf) | round(2) }}"
        unit_of_measurement: CHF
        icon: mdi:cash-minus
      - name: Steuerungstest Nutzen Börsenpreis
        unique_id: homi_steuerung_test_boerse
        value_template: "{{ (0 - value_json.summe.boerse_chf) | round(2) }}"
        unit_of_measurement: CHF
        icon: mdi:cash-plus
  - resource: http://127.0.0.1:8099/api/verguetung
    scan_interval: 1800
    sensor:
      - name: Vergütung Abregelschwelle 2027
        unique_id: homi_verguetung_schwelle
        value_template: "{{ (value_json.quartale | last).schwelle_rp }}"
        availability: "{{ value_json.quartale is defined and value_json.quartale | length > 0 }}"
        unit_of_measurement: Rp./kWh
        icon: mdi:transmission-tower-off
        json_attributes: [modell, modell_name, minimal_rp, ausgleich_bei_minuspreis, erklaerung]
      - name: Vergütung Referenz-Marktpreis Quartal
        unique_id: homi_verguetung_rmp
        value_template: "{{ (value_json.quartale | last).rmp_rp }}"
        availability: "{{ value_json.quartale is defined and value_json.quartale | length > 0 }}"
        unit_of_measurement: Rp./kWh
        icon: mdi:chart-bell-curve
        json_attributes_path: "$.quartale[-1:]"
        json_attributes: [quartal, ausgleich_rp, einspeisung_mit_preis_kwh, wert_chf, rmp_quelle]
  - resource: http://127.0.0.1:8099/api/zuordnung
    scan_interval: 1800
    sensor:
      - name: Grösster Verbraucher
        unique_id: homi_zuordnung_top
        value_template: "{{ (value_json.geraete | first).name }}"
        availability: "{{ value_json.aktiv | default(false) and value_json.geraete | length > 0 }}"
        icon: mdi:magnify-expand
        json_attributes: [zeitraum, gesamt_kwh, grundlast_w, infrarot_w, jetzt, geraete, hinweis]
      - name: Infrarotheizung pro Tag (geschätzt)
        unique_id: homi_zuordnung_infrarot_kwh
        value_template: "{{ (value_json.geraete | selectattr('id', 'eq', 'infrarot') | map(attribute='kwh_tag') | first) | default(0) }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        unit_of_measurement: kWh
        icon: mdi:radiator
      - name: Grundlast (Zuordnung)
        unique_id: homi_zuordnung_grundlast
        value_template: "{{ value_json.grundlast_w }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        unit_of_measurement: W
        device_class: power
  - resource: http://127.0.0.1:8099/api/geraete
    scan_interval: 30
    sensor:
      - name: Solarladestation
        unique_id: homi_geraet_laden_mobil
        value_template: "{{ 'lädt' if value_json.geraete[0].live.an else ('nicht erreichbar' if value_json.geraete[0].live.erreichbar == false else 'aus') }}"
        icon: mdi:cellphone-charging
        json_attributes_path: "$.geraete[0]"
        json_attributes: [id, name, modus, regel, ein_ab_w, aus_unter_w, live, heute, woche]
      - name: Solarladestation Leistung
        unique_id: homi_geraet_laden_mobil_w
        value_template: "{{ value_json.geraete[0].live.leistung_w | default(0) }}"
        unit_of_measurement: W
        device_class: power
      - name: Solarladestation heute
        unique_id: homi_geraet_laden_mobil_kwh
        value_template: "{{ value_json.geraete[0].heute.kwh }}"
        unit_of_measurement: kWh
        icon: mdi:counter
  - resource: http://127.0.0.1:8099/api/berater
    scan_interval: 3600
    sensor:
      - name: Energieberater Tipp 1
        unique_id: homi_berater_tipp_1
        value_template: "{{ value_json.tipps[0].titel if value_json.tipps | length > 0 else 'kein Tipp' }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        icon: mdi:lightbulb-on-outline
        json_attributes_path: "$.tipps[0]"
        json_attributes: [text, warum, rechnung, aktion, chf_jahr, kwh_jahr, bedingung, akut]
      - name: Energieberater Tipp 2
        unique_id: homi_berater_tipp_2
        value_template: "{{ value_json.tipps[1].titel if value_json.tipps | length > 1 else 'kein Tipp' }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        icon: mdi:lightbulb-on-outline
        json_attributes_path: "$.tipps[1]"
        json_attributes: [text, warum, rechnung, aktion, chf_jahr, kwh_jahr, bedingung, akut]
      - name: Energieberater Tipp 3
        unique_id: homi_berater_tipp_3
        value_template: "{{ value_json.tipps[2].titel if value_json.tipps | length > 2 else 'kein Tipp' }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        icon: mdi:lightbulb-on-outline
        json_attributes_path: "$.tipps[2]"
        json_attributes: [text, warum, rechnung, aktion, chf_jahr, kwh_jahr, bedingung, akut]
      - name: Energieberater Sparpotenzial
        unique_id: homi_berater_summe
        value_template: "{{ value_json.summe_chf_jahr }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        unit_of_measurement: CHF
        icon: mdi:piggy-bank-outline
        json_attributes: [monate_frueher, grundlast_w, spitze_stunde, tage, stand, basis, auswahl, geprueft]
      - name: Energieberater Batterie
        unique_id: homi_berater_batterie
        value_template: "{{ value_json.batterie.urteil if value_json.batterie.modus == 'kaufen' else 'vorhanden' }}"
        availability: "{{ value_json.aktiv | default(false) }}"
        icon: mdi:home-battery-outline
        json_attributes_path: "$.batterie"
        json_attributes: [text, warum, rechnung, beste_kwh, optionen, tipps, hinweis]

# Netzbezug/Einspeisung als kWh-Zähler aus den Fronius-Leistungswerten (Smart Meter sitzt im Verbrauchszweig)
sensor:
  - platform: integration
    source: sensor.solarnet_leistung_netzbezug
    name: Netzbezug Energie
    unique_id: domus_netzbezug_energie
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 1
  - platform: integration
    source: sensor.solarnet_leistung_netzeinspeisung
    name: Netzeinspeisung Energie
    unique_id: domus_netzeinspeisung_energie
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 1

# Wechselrichter-Steuerung (homi, Modbus): Schalter schreiben über /api/steuerung (nur von 127.0.0.1 erlaubt)
rest_command:
  homi_wechselrichter:
    url: http://127.0.0.1:8099/api/steuerung
    method: POST
    content_type: application/json
    payload: '{"wr": "{{ wr }}"}'
  homi_geraet:
    url: http://127.0.0.1:8099/api/geraete
    method: POST
    content_type: application/json
    payload: '{"id": "{{ id }}", "modus": "{{ modus }}"}'
  homi_regel:
    url: http://127.0.0.1:8099/api/steuerung
    method: POST
    content_type: application/json
    payload: '{"regel": {{ "true" if an else "false" }}}'

template:
  - select:
      - name: Solarladestation Modus
        unique_id: homi_geraet_laden_mobil_modus
        icon: mdi:power-plug-battery
        options: "{{ ['auto', 'ein', 'aus'] }}"
        state: "{{ state_attr('sensor.ladestation_handy', 'modus') | default('auto') }}"
        availability: "{{ state_attr('sensor.ladestation_handy', 'modus') is not none }}"
        select_option:
          - action: rest_command.homi_geraet
            data:
              id: laden-mobil
              modus: "{{ option }}"
          - action: homeassistant.update_entity
            target: {entity_id: sensor.ladestation_handy}
  - switch:
      - name: Wechselrichter
        unique_id: homi_wechselrichter_schalter
        icon: mdi:solar-power-variant
        state: "{{ state_attr('sensor.fronius_steuerung', 'schalter').wr | default('ein') == 'ein' }}"
        availability: "{{ state_attr('sensor.fronius_steuerung', 'schalter') is not none }}"
        turn_on:
          - action: rest_command.homi_wechselrichter
            data: {wr: ein}
          - action: homeassistant.update_entity
            target: {entity_id: sensor.fronius_steuerung}
        turn_off:
          - action: rest_command.homi_wechselrichter
            data: {wr: aus}
          - action: homeassistant.update_entity
            target: {entity_id: sensor.fronius_steuerung}
      - name: Automatik Minuspreis
        unique_id: homi_regel_minuspreis
        icon: mdi:transmission-tower-off
        state: "{{ state_attr('sensor.fronius_steuerung', 'schalter').regel | default(false) }}"
        availability: "{{ state_attr('sensor.fronius_steuerung', 'schalter') is not none }}"
        turn_on:
          - action: rest_command.homi_regel
            data: {an: true}
          - action: homeassistant.update_entity
            target: {entity_id: sensor.fronius_steuerung}
        turn_off:
          - action: rest_command.homi_regel
            data: {an: false}
          - action: homeassistant.update_entity
            target: {entity_id: sensor.fronius_steuerung}
