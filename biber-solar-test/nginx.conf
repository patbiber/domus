# Statische Auslieferung der Testseite (im Container biber-solar-test)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # .git, .github, .gitignore usw. nie ausliefern
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
