# Statische Auslieferung der gebauten MkDocs-Seite (im Container training)
server {
    listen 80;
    server_name _;
    root /srv/aktuell;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
