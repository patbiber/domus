# HTTP: ACME-Challenge für Let's Encrypt, sonst Weiterleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name domus.biber.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name domus.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/domus.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domus.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    # Home Assistant (network_mode: host) über das Docker-Host-Gateway
    location / {
        proxy_pass http://host.docker.internal:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
