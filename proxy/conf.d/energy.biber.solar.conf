# energy.biber.solar: frühere Adresse der homi-Verkaufsseite (05.–09.10.2026). Leitet dauerhaft auf homi.solar weiter.
# 308 statt 301: Pfad, Parameter und Methode bleiben erhalten – Bestätigungs-/Abmeldelinks aus bereits verschickten
# Mails (/api/warnung/…?t=…) und Formular-POSTs aus noch offenen alten Seiten funktionieren weiter.
# Zertifikat bleibt (Erneuerung über Port 80), damit https://energy.biber.solar ohne Warnung weiterleitet.

server {
    listen 80;
    listen [::]:80;
    server_name energy.biber.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://homi.solar$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name energy.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/energy.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/energy.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    server_tokens off;

    location / {
        return 308 https://homi.solar$request_uri;
    }
}
