# training.biber.solar: Solar- & Haustechnik-Wissen (MkDocs), Container training, Ordner training/, Quelle github.com/patbiber/solartech
# Live auf dem NUC seit 03.10.2026 (vorher OVH-VPS). Zertifikat Let's Encrypt für training.biber.solar.
server {
    listen 80;
    listen [::]:80;
    server_name training.biber.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://training.biber.solar$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name training.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/training.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/training.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    # Nur lesende Anfragen (statische Seite, kein Backend)
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Container-Name erst bei der Anfrage auflösen: fehlt der Container, gibt es 502, nginx startet trotzdem
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $training http://training:80;

    location / {
        proxy_pass $training;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
