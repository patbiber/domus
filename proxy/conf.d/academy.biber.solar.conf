limit_req_zone $binary_remote_addr zone=academy_login:1m rate=10r/m;

# academy.biber.solar: EnergyHub Academy (Container academy, Ordner academy/, Code github.com/patbiber/energyhub-academy)
# Vorschau: bis zu Patricks «ok» nicht in Suchmaschinen (X-Robots-Tag). Danach die noindex-Zeile entfernen.

server {
    listen 80;
    listen [::]:80;
    server_name academy.biber.solar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name academy.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/academy.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;      # Vorschau
    server_tokens off;
    client_max_body_size 64k;

    # Anmeldung: höchstens 10 Anfragen pro Minute und IP (zusätzlich zur Grenze in der App)
    location = /login {
        limit_req zone=academy_login burst=5 nodelay;
        proxy_pass $academy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $academy http://academy:8000;

    location / {
        proxy_pass $academy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
