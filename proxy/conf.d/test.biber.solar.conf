# test.biber.solar: Testseite von biber.solar (Dienst website/, Port 8097)

# HTTP: ACME-Challenge für Let's Encrypt, sonst Weiterleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name test.biber.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/test.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # Testseite: nicht in Suchmaschinen

    server_tokens off;

    # Nur lesende Anfragen
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        proxy_pass http://host.docker.internal:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
