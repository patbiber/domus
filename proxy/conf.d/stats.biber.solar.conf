# stats.biber.solar: Webstatistik Umami (Container umami, Ordner umami/), Zertifikat Let's Encrypt für stats.biber.solar.
# Dashboard mit eigenem Login; /s.js (Zählskript) und /api/send (Zählung) werden von biber.solar und homi.solar aufgerufen.
limit_req_zone $binary_remote_addr zone=stats_send:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name stats.biber.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stats.biber.solar$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/stats.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 64k;

    # Zählungen nicht protokollieren (sonst stünde die IP doch wieder in einem Log)
    access_log off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami http://umami:3000;

    location = /api/send {
        limit_req zone=stats_send burst=30 nodelay;
        proxy_pass $umami;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # Umami leitet daraus nur das Land ab, speichert die IP nicht
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $umami;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
