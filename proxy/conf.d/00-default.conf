# Unbekannte Hostnamen / direkte IP-Zugriffe ablehnen
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

# HTTPS für unbekannte Hostnamen (z. B. über den Wildcard-Eintrag *.biber.solar): TLS-Verbindung sofort ablehnen,
# statt das Zertifikat einer anderen Seite zu zeigen. Neue Subdomain = eigene Datei mit server_name + Zertifikat.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
