# homi.solar: Basis-Domain für die Kunden-Instanzen (<kunde>.homi.solar, siehe kunden/).
# Die Domain selbst leitet vorerst auf die Verkaufsseite weiter (302, damit sie später eine eigene Seite werden kann).
# Wildcard *.homi.solar zeigt im DNS auf den NUC; nicht eingerichtete Namen lehnt 00-default.conf ab.

server {
    listen 80;
    listen [::]:80;
    server_name homi.solar www.homi.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name homi.solar www.homi.solar;

    ssl_certificate     /etc/letsencrypt/live/homi.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homi.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    server_tokens off;

    location / {
        return 302 https://energy.biber.solar/;
    }
}
