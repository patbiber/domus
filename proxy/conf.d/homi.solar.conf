# homi.solar: Hauptadresse der homi-Verkaufsseite (Container energy, Ordner energy/) und Basis-Domain für die
# Kunden-Instanzen (<name>.homi.solar, siehe kunden/). www.homi.solar und energy.biber.solar leiten hierher weiter.
# Wildcard *.homi.solar zeigt im DNS auf den NUC; nicht eingerichtete Namen lehnt 00-default.conf ab.
limit_req_zone $binary_remote_addr zone=energy_anfrage:1m rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name homi.solar www.homi.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://homi.solar$request_uri;
    }
}

# www.homi.solar -> homi.solar
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.homi.solar;

    ssl_certificate     /etc/letsencrypt/live/homi.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homi.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    server_tokens off;

    location / {
        return 301 https://homi.solar$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name homi.solar;

    ssl_certificate     /etc/letsencrypt/live/homi.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homi.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    server_tokens off;
    client_max_body_size 32k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $energy http://energy:8080;

    # Anfrageformular: nur POST, höchstens 2 Anfragen pro Minute und IP (Spam-Bremse)
    location = /api/anfrage {
        limit_except POST { deny all; }
        limit_req zone=energy_anfrage burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $energy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gratis-Minuspreis-Warnung abonnieren (Double-Opt-in), gleiche Spam-Bremse
    location = /api/warnung {
        limit_except POST { deny all; }
        limit_req zone=energy_anfrage burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $energy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_except GET { deny all; }
        proxy_pass $energy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
