# home.biber.solar: Retro-Energie-Webseite (Dienst energie/, network_mode: host, Port 8099)
limit_req_zone $binary_remote_addr zone=home_api:1m rate=2r/s;

# Erfolgreiche Datenabrufe der Seite (alle 5 s) nicht protokollieren; Seitenaufrufe, Logins und Fehler schon
map "$uri:$status" $home_log {
    "~^/api/[a-z]+:2"  0;
    default            1;
}

# Nur lesende Anfragen – einzige Ausnahme: An-/Abmelden der App für Push-Nachrichten
map "$request_method:$uri" $home_methode_ok {
    "~^(GET|HEAD):"    1;
    "POST:/api/push"   1;
    default            0;
}

# HTTP: ACME-Challenge für Let's Encrypt, sonst Weiterleitung auf HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name home.biber.solar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name home.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/home.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    server_tokens off;
    access_log /var/log/nginx/access.log main if=$home_log;

    if ($home_methode_ok = 0) { return 405; }

    # Zugang nur mit Passwort (Datei nicht im Repo, siehe README)
    auth_basic           "home.biber.solar";
    auth_basic_user_file /etc/nginx/conf.d/home.biber.solar.htpasswd;

    # App-Hülle (Manifest, Service Worker, Icons, Offline-Seite) ohne Passwort, damit Installation und
    # Benachrichtigungs-Icons in allen Browsern klappen. Enthält keine Daten; alles andere bleibt geschützt.
    location ~ ^/(manifest\.webmanifest|sw\.js|offline\.html|icons/[a-z0-9-]+\.png)$ {
        auth_basic off;
        limit_req zone=home_api burst=20 nodelay;
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
    }

    location = /api/push {
        limit_req zone=home_api burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=home_api burst=20 nodelay;
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=home_api burst=20 nodelay;   # bremst auch Passwort-Rateversuche
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
    }
}
