# projects.biber.solar: Projekt- und Aufgabenverwaltung (Vikunja, Container vikunja, Ordner projekte/, seit 14.11.2026)
server {
    listen 80;
    listen [::]:80;
    server_name projects.biber.solar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

limit_req_zone $binary_remote_addr zone=projects_login:1m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name projects.biber.solar;

    ssl_certificate     /etc/letsencrypt/live/projects.biber.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projects.biber.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;      # privat, nicht in Suchmaschinen
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    server_tokens off;
    client_max_body_size 20m;                                # Anhänge an Aufgaben

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $vikunja http://vikunja:3456;

    # Anmeldung: höchstens 10 Versuche pro Minute und IP (zusätzlich zur Grenze in Vikunja)
    location = /api/v1/login {
        limit_req zone=projects_login burst=5 nodelay;
        proxy_pass $vikunja;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $vikunja;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;              # Live-Aktualisierung (WebSocket)
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
