<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>homi Monitor</title>
<!-- Monitor-Modus für den Bildschirm im Gang (Raspberry Pi, Anleitung monitor/README.md):
     Vollbild ohne Bedienung, wechselt alle 15 s die untere Tafel, holt die Daten selbst.
     Bewusst leicht gebaut (kein Canvas-Haus, kaum Animation), damit auch ein alter Pi flüssig bleibt.
     Parameter: ?tafel=preis|tag|prognose|heizung|woche|tipp hält eine Tafel fest (zum Testen). -->
<style>
  @font-face { font-family: "Press Start 2P"; src: url("fonts/PressStart2P-Regular.ttf") format("truetype"); }
  @font-face { font-family: "VT323"; src: url("fonts/VT323-Regular.ttf") format("truetype"); }
  @font-face { font-family: "homi-zeichen"; src: url("fonts/homi-zeichen.ttf") format("truetype"); }
  :root {
    --pix: "Press Start 2P", "homi-zeichen", "Courier New", monospace;
    --term: "VT323", "homi-zeichen", "Courier New", monospace;
    --u: min(1vw, 1.25vh);             /* Grundeinheit: passt für 5:4 (1280×1024) und 16:10 (1440×900) */
    --blau: #352879; --hellblau: #6c5eb5; --eisblau: #b3abf0;
    --gelb: #ffff55; --gruen: #55ff55; --gruen-d: #00aa00; --rot: #ff5555; --cyan: #55ffff; --lila: #ff55ff; --grau: #aaa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; cursor: none; }
  body { font-family: var(--term); -webkit-font-smoothing: none; }
  #bild { position: absolute; inset: 1.2vh 1.2vw; display: grid; grid-template-rows: auto auto 1fr auto; gap: 1.6vh;
    border: calc(var(--u) * .5) solid var(--blau); padding: 1.6vh 1.6vw; transition: transform 2s; }
  #bild::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.22) 2px 3px); }

  .kopf { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--blau); padding-bottom: 1.2vh; }
  .logo { font: calc(var(--u) * 4.2)/1 var(--pix); color: var(--gelb); letter-spacing: .1em;
    text-shadow: .08em .08em 0 #ff9900, .16em .16em 0 #cc2200, .24em .24em 0 #5a0d6e; }
  .logo small { font-size: .3em; color: var(--eisblau); text-shadow: none; margin-left: 1.2em; vertical-align: .9em; letter-spacing: .1em; }
  .uhr { text-align: right; font: calc(var(--u) * 4.2)/1 var(--pix); color: #fff; }
  .uhr small { display: block; font-size: .32em; color: var(--eisblau); margin-top: .7em; }
  .uhr .p { animation: blink 2s steps(2) infinite; }

  #minus { display: none; font: calc(var(--u) * 2)/1.5 var(--pix); text-align: center; color: var(--gelb); background: #2a0000;
    border: .25em solid var(--rot); padding: .5em; animation: rahmen 1.2s steps(2) infinite; }
  #minus.an { display: block; }
  @keyframes rahmen { 50% { border-color: var(--gelb); } }

  .fluss { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 1vw; }
  .kachel { border: 3px solid var(--hellblau); padding: 1.6vh 1vw; text-align: center; background: #07051a; }
  .kachel .k { font: calc(var(--u) * 1.5)/1 var(--pix); color: var(--eisblau); letter-spacing: .1em; }
  .kachel .v { font: calc(var(--u) * 5.2)/1.15 var(--pix); margin: 1.4vh 0 .8vh; white-space: nowrap; }
  .kachel .s { font-size: calc(var(--u) * 3); color: var(--grau); }
  .sonne .v { color: var(--gelb); } .haus .v { color: var(--rot); } .netz .v { color: var(--cyan); }
  .netz.raus { border-color: var(--gruen-d); } .netz.raus .v { color: var(--gruen); }
  .pfeil { font: calc(var(--u) * 4)/1 var(--pix); color: var(--gruen); }
  .pfeil.still { color: #333; }
  .pfeil.lauf { animation: blink 1.4s steps(2) infinite; }

  .tafel { border: 3px solid var(--blau); display: flex; flex-direction: column; min-height: 0; padding: 1.4vh 1.2vw; }
  .tafel h2 { margin: 0 0 1.2vh; font: calc(var(--u) * 1.9)/1.2 var(--pix); color: var(--gelb); display: flex; justify-content: space-between; gap: 1em; }
  .tafel h2 .punkte { color: var(--hellblau); letter-spacing: .3em; white-space: nowrap; }
  .tafel h2 .punkte b { color: var(--gelb); font-weight: normal; }
  #inhalt { flex: 1; min-height: 0; display: flex; flex-direction: column; font-size: calc(var(--u) * 3.4); line-height: 1.15; }
  .zeilen { display: grid; grid-template-columns: repeat(auto-fit, minmax(26%, 1fr)); gap: 1.4vh 2vw; }
  .zahl .k { color: var(--eisblau); font-size: .85em; }
  .zahl .v { font: calc(var(--u) * 3)/1.3 var(--pix); color: #fff; }
  .gelb { color: var(--gelb) !important; } .gruen { color: var(--gruen) !important; } .rot { color: var(--rot) !important; } .cyan { color: var(--cyan) !important; }
  .satz { color: #ddd; margin-top: 1.6vh; }
  /* einfache Balken statt Canvas (leicht für alte Pis) */
  .balken { flex: 1; min-height: 6vh; display: flex; align-items: flex-end; gap: 2px; border-bottom: 2px solid #444; position: relative; margin-top: 1vh; }
  .balken i { flex: 1; background: var(--hellblau); min-height: 1px; }
  .balken i.jetzt { background: var(--gelb); }
  .balken i.neg { background: var(--gruen); }
  .balken i.teuer { background: var(--rot); }
  .balken i.pv { background: var(--gelb); }
  .achse { display: flex; justify-content: space-between; color: var(--grau); font-size: .75em; margin-top: .4vh; }
  .legende { color: var(--grau); font-size: .8em; margin-top: .6vh; }
  .legende span { margin-right: 2em; } .legende span::before { content: "■ "; }
  .legende .l-pv::before { color: var(--gelb); } .legende .l-haus::before { color: var(--rot); }
  .doppel { display: flex; gap: 2px; flex: 1; align-items: flex-end; height: 100%; }
  .doppel i { flex: 1; } .doppel i.h { background: var(--rot); opacity: .75; }
  .tipp { font: calc(var(--u) * 2.4)/1.5 var(--pix); color: var(--gelb); margin-bottom: 1.4vh; }

  .fuss { font: calc(var(--u) * 1.35)/1.6 var(--pix); color: var(--gelb); text-align: center; min-height: 1.6em; text-shadow: 2px 2px 0 #000; }
  .fuss.alt { color: var(--rot); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="bild">
  <div class="kopf">
    <div class="logo">homi 64<small>ENERGIE-MONITOR</small></div>
    <div class="uhr"><span id="zeit">--:--</span><small id="datum"></small></div>
  </div>
  <div>
    <div id="minus"></div>
    <div class="fluss">
      <div class="kachel sonne"><div class="k">☀ SONNE</div><div class="v" id="pv">–</div><div class="s" id="pv-s"></div></div>
      <div class="pfeil" id="p1">→</div>
      <div class="kachel haus"><div class="k">■ HAUS</div><div class="v" id="haus">–</div><div class="s" id="haus-s"></div></div>
      <div class="pfeil" id="p2">←</div>
      <div class="kachel netz" id="netz-k"><div class="k">● NETZ</div><div class="v" id="netz">–</div><div class="s" id="netz-s"></div></div>
    </div>
  </div>
  <div class="tafel"><h2><span id="titel"></span><span class="punkte" id="punkte"></span></h2><div id="inhalt"></div></div>
  <div class="fuss" id="fuss">homi startet …</div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fest = new URLSearchParams(location.search).get("tafel");
const D = {};                      // letzte Antworten je API
let zuletzt = 0;                   // Zeit der letzten Statusantwort

const zahl = (x, n = 0) => (x == null || isNaN(x)) ? "–" : Number(x).toLocaleString("de-CH", { minimumFractionDigits: n, maximumFractionDigits: n });
const watt = (w) => w == null ? "–" : Math.abs(w) >= 1000 ? zahl(Math.abs(w) / 1000, 2) + " kW" : zahl(Math.abs(w)) + " W";
const hhmm = (d) => d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function holen(name) {
  try {
    const r = await fetch("api/" + name, { cache: "no-store" });
    if (r.ok) { D[name] = await r.json(); if (name === "status") zuletzt = Date.now(); }
  } catch {}
}

/* ---------- Uhr ---------- */
function uhr() {
  const d = new Date();
  $("zeit").innerHTML = String(d.getHours()).padStart(2, "0") + '<span class="p">:</span>' + String(d.getMinutes()).padStart(2, "0");
  $("datum").textContent = d.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" }).toUpperCase();
}

/* ---------- oberer Teil: Sonne → Haus ← Netz ---------- */
function fluss() {
  const s = D.status;
  if (!s) return;
  $("pv").textContent = watt(s.pv_w);
  $("pv-s").textContent = "heute " + zahl(s.pv_heute_kwh, 1) + " kWh";
  $("haus").textContent = watt(s.verbrauch_w);
  $("haus-s").textContent = s.autarkie_pct != null ? zahl(s.autarkie_pct) + " % eigener Strom" : "";
  const raus = (s.netz_w || 0) < -20;
  $("netz").textContent = watt(s.netz_w);
  $("netz-k").classList.toggle("raus", raus);
  $("netz-s").textContent = raus ? "Einspeisung" : (s.netz_w || 0) > 20 ? "Bezug" : "ausgeglichen";
  const p1 = $("p1"), p2 = $("p2");
  p1.className = "pfeil " + ((s.pv_w || 0) > 20 ? "lauf" : "still");
  p2.textContent = raus ? "→" : "←";
  p2.className = "pfeil " + (Math.abs(s.netz_w || 0) > 20 ? "lauf" : "still");
  p2.style.color = raus ? "var(--gruen)" : (s.netz_w || 0) > 20 ? "var(--cyan)" : "";
  const b = s.boerse || {};
  const m = $("minus");
  if (b.negativ) { m.innerHTML = "⚠ NEGATIVER BÖRSENPREIS: " + zahl(b.rp_kwh, 1) + " RP./KWH ⚠<br>STROM IM ÜBERFLUSS – JETZT WASCHEN, LADEN, KOCHEN!"; m.classList.add("an"); }
  else if (b.naechster_negativer) { m.textContent = "BALD NEGATIVER PREIS: " + esc(b.naechster_negativer).replace("T", " ").slice(0, 16); m.classList.add("an"); }
  else m.classList.remove("an");
}

/* ---------- Tafeln ---------- */
function tafelPreis() {
  const b = D.boerse; if (!b || !b.preise) return null;
  const jetzt = Date.now() / 1000;
  // ganzer Tag lokal: Einträge mit heutigem Datum (Zeiten sind lokal)
  const tag = b.preise.filter((p) => p.zeit.startsWith(lokalDatum()));
  if (!tag.length) return null;
  const max = Math.max(...tag.map((p) => p.rp_kwh)), min = Math.min(0, ...tag.map((p) => p.rp_kwh));
  const a = b.aktuell || {};
  const balken = tag.map((p) => {
    const h = ((p.rp_kwh - min) / (max - min || 1)) * 100;
    const k = jetzt >= p.ts && jetzt < p.ts + (b.intervall_s || 900) ? "jetzt" : p.rp_kwh < 0 ? "neg" : p.rp_kwh >= max * .9 ? "teuer" : "";
    return `<i class="${k}" style="height:${Math.max(h, 1).toFixed(1)}%"></i>`;
  }).join("");
  return { titel: "BÖRSENPREIS HEUTE", html:
    `<div class="zeilen"><div class="zahl"><div class="k">jetzt</div><div class="v gelb">${zahl(a.rp_kwh, 1)} Rp.</div></div>
     <div class="zahl"><div class="k">tiefster</div><div class="v gruen">${zahl(Math.min(...tag.map((p) => p.rp_kwh)), 1)} Rp.</div></div>
     <div class="zahl"><div class="k">höchster</div><div class="v rot">${zahl(max, 1)} Rp.</div></div></div>
     <div class="balken">${balken}</div><div class="achse"><span>0 Uhr</span><span>6</span><span>12</span><span>18</span><span>24</span></div>` };
}
function lokalDatum(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function tafelTag() {
  const h = D.history; if (!Array.isArray(h) || !h.length) return null;
  // letzte 24 h in 48 Halbstunden: Sonne (gelb) und Haus (rot) nebeneinander
  const ende = Date.now(), fach = new Array(48).fill(0).map(() => ({ pv: 0, haus: 0, n: 0 }));
  for (const r of h) {
    const t = new Date(r.zeit).getTime(), i = 47 - Math.floor((ende - t) / 1800000);
    if (i < 0 || i > 47) continue;
    fach[i].pv += r.pv_w || 0; fach[i].haus += r.verbrauch_w || 0; fach[i].n++;
  }
  const werte = fach.map((f) => f.n ? { pv: f.pv / f.n, haus: f.haus / f.n } : { pv: 0, haus: 0 });
  const max = Math.max(100, ...werte.map((w) => Math.max(w.pv, w.haus)));
  const balken = werte.map((w) => `<span class="doppel"><i class="pv" style="background:var(--gelb);height:${(w.pv / max * 100).toFixed(1)}%"></i><i class="h" style="height:${(w.haus / max * 100).toFixed(1)}%"></i></span>`).join("");
  const vor = new Date(ende - 86400000);
  const s = D.status || {};
  return { titel: "DIE LETZTEN 24 STUNDEN", html:
    `<div class="balken" style="gap:3px">${balken}</div>
     <div class="achse"><span>${hhmm(vor)}</span><span>${hhmm(new Date(ende - 43200000))}</span><span>jetzt</span></div>
     <div class="legende"><span class="l-pv">Sonne</span><span class="l-haus">Haus</span>Sonne heute: ${zahl(s.pv_heute_kwh, 1)} kWh</div>` };
}
function tafelPrognose() {
  const p = (D.status || {}).prognose; if (!p || !p.heute) return null;
  const teil = (n, x) => !x ? "" : `<div class="zahl"><div class="k">${n}</div><div class="v gelb">${zahl(x.kwh, 1)} kWh</div>
      <div>Wolken ${zahl(x.wolken_pct)} %${x.bestes_fenster ? ` · beste Zeit ${esc(x.bestes_fenster.von)}–${esc(x.bestes_fenster.bis)}` : ""}</div></div>`;
  const morgen = p.morgen || {};
  const rat = (morgen.kwh || 0) >= 8 ? "Morgen gibt es viel Sonne: Wäsche und Spülmaschine auf die beste Zeit stellen!"
    : (morgen.kwh || 0) >= 3 ? "Morgen etwas Sonne – Waschen am besten zur besten Zeit." : "Morgen wenig Sonne – heute ist kein Tag zum Sparen verpasst.";
  return { titel: "SONNENPROGNOSE", html: `<div class="zeilen">${teil("HEUTE", p.heute)}${teil("MORGEN", p.morgen)}</div><div class="satz">${rat}</div>` };
}
function tafelHeizung() {
  const h = D.heizung; if (!h || !h.aktiv) return null;
  const l = h.live || {};
  return { titel: "DACHSTOCK-HEIZUNG", html:
    `<div class="zeilen"><div class="zahl"><div class="k">Temperatur</div><div class="v cyan">${zahl(l.ist_c, 1)} °C</div><div>Soll ${zahl(l.soll_c, 1)} °C</div></div>
     <div class="zahl"><div class="k">jetzt</div><div class="v ${l.heizt ? "rot" : "gruen"}">${l.erreichbar === false ? "OFFLINE" : l.heizt ? "HEIZT" : "RUHT"}</div><div>${l.heizt ? zahl(l.leistung_w) + " W" : ""}</div></div>
     <div class="zahl"><div class="k">heute</div><div class="v">${zahl((h.heute || {}).kwh, 1)} kWh</div><div>${h.heute && h.heute.kwh ? zahl(h.heute.solar_kwh / h.heute.kwh * 100) + " % aus Sonne" : ""}</div></div></div>` };
}
function tafelWoche() {
  const w = D.wochenbericht; if (!w || !w.aktiv) return null;
  return { titel: "WOCHENBERICHT " + esc(w.titel).toUpperCase(), html:
    `<div class="zeilen"><div class="zahl"><div class="k">erzeugt</div><div class="v gelb">${zahl(w.pv_kwh)} kWh</div></div>
     <div class="zahl"><div class="k">gebraucht</div><div class="v rot">${zahl(w.verbrauch_kwh)} kWh</div></div>
     <div class="zahl"><div class="k">Bilanz</div><div class="v ${w.saldo_chf >= 0 ? "gruen" : "rot"}">CHF ${zahl(w.saldo_chf, 2)}</div></div></div>
     <div class="satz">${esc(w.satz)}</div>` };
}
let tippNr = 0;
function tafelTipp() {
  const r = D.berater; if (!r || !r.aktiv || !r.tipps || !r.tipps.length) return null;
  const t = r.tipps[tippNr++ % r.tipps.length];
  return { titel: "TIPP VOM ENERGIEBERATER", html:
    `<div class="tipp">${esc(t.titel)} · CHF ${zahl(t.chf_jahr)} pro Jahr</div><div class="satz" style="margin:0">${esc(t.text)}</div>${t.aktion ? `<div class="satz gruen">→ ${esc(t.aktion.split(";")[0])}</div>` : ""}` };
}
const TAFELN = { preis: tafelPreis, tag: tafelTag, prognose: tafelPrognose, heizung: tafelHeizung, woche: tafelWoche, tipp: tafelTipp };
const REIHE = Object.keys(TAFELN);
let nr = -1;
function naechsteTafel() {
  for (let v = 0; v < REIHE.length; v++) {
    nr = fest && TAFELN[fest] ? REIHE.indexOf(fest) : (nr + 1) % REIHE.length;
    const t = TAFELN[REIHE[nr]]();
    if (t) {
      $("titel").textContent = t.titel;
      $("inhalt").innerHTML = t.html;
      $("punkte").innerHTML = REIHE.map((_, i) => i === nr ? "<b>●</b>" : "·").join("");
      return;
    }
    if (fest) return;
  }
}

/* ---------- Fusszeile: homi sagt etwas ---------- */
function fuss() {
  const f = $("fuss"), s = D.status;
  const alt = !zuletzt || Date.now() - zuletzt > 120000;
  f.classList.toggle("alt", alt);
  if (alt) { f.textContent = zuletzt ? "⚠ KEINE DATEN SEIT " + hhmm(new Date(zuletzt)) + " – homi wird gesucht …" : "⚠ homi ist nicht erreichbar – neuer Versuch läuft …"; return; }
  const satz = [];
  if ((s.netz_w || 0) < -200) satz.push("Gerade gibt es Sonnenstrom übrig – guter Moment für Wäsche oder Spülmaschine.");
  else if ((s.pv_w || 0) > (s.verbrauch_w || 0) && (s.pv_w || 0) > 50) satz.push("Das Haus läuft gerade ganz mit Sonnenstrom.");
  else if ((s.pv_w || 0) < 20) satz.push("Die Sonne schläft – der Strom kommt jetzt aus dem Netz.");
  else satz.push("Die Sonne hilft mit: " + watt(s.pv_w) + " vom Dach.");
  if (s.kosten_chf_h > 0.005) satz.push("Kostet gerade " + zahl(s.kosten_chf_h * 100, 1) + " Rp. pro Stunde.");
  else if (s.erloes_chf_h > 0.005) satz.push("Bringt gerade " + zahl(s.erloes_chf_h * 100, 1) + " Rp. pro Stunde.");
  f.textContent = satz.join(" ");
}

/* ---------- Takt ---------- */
async function schnell() { await holen("status"); fluss(); fuss(); }
async function mittel() { await Promise.all(["boerse", "heizung", "history"].map(holen)); }
async function langsam() { await Promise.all(["berater", "wochenbericht"].map(holen)); }
// Einbrennschutz: alles alle 3 Minuten um ein paar Pixel verschieben
function schieben() {
  const x = Math.round(Math.random() * 12 - 6), y = Math.round(Math.random() * 8 - 4);
  $("bild").style.transform = `translate(${x}px, ${y}px)`;
}

uhr(); setInterval(uhr, 5000);
(async () => {
  await Promise.all([schnell(), mittel(), langsam()]);
  naechsteTafel();
  setInterval(schnell, 10000);
  setInterval(mittel, 120000);
  setInterval(langsam, 1800000);
  setInterval(naechsteTafel, 15000);
  setInterval(schieben, 180000);
})();
// Seite einmal pro Nacht neu laden (holt Änderungen und räumt Speicher auf, wichtig bei kleinen Pis)
setInterval(() => { const d = new Date(); if (d.getHours() === 4 && d.getMinutes() < 2) location.reload(); }, 60000);
</script>
</body>
</html>
