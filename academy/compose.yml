# EnergyHub Academy (academy.biber.solar, seit 06.11.2026): Lern- und Mitgliederplattform für die Solar-EnergyHubs in
# Ghana, Kamerun und Togo (Auftrag MPower Ventures / REPIC 2025.16). Code und Inhalte: ./repo = eigenes Git-Repo
# (github.com/patbiber/energyhub-academy, nicht Teil von domus). Bauen und starten: ./update.sh
# Daten (SQLite, Mail-Ausgang): ./data (nicht im Repo, im Gesamt-Backup). Mails verschickt der Host: academy-mail.path
# beobachtet data/outbox, academy-mail.py sendet über msmtp (Konto academy, academy@biber.solar) – keine SMTP-Daten im Container.
# Admins (sehen alle Mitglieder): ACADEMY_ADMINS in ../.env. WhatsApp-Kanal-Link: ACADEMY_WHATSAPP_CHANNEL in ../.env.
services:
  academy:
    container_name: academy
    build: ./repo
    image: academy:local
    restart: unless-stopped
    user: "1000:1000"                  # wie claude auf dem Host, damit academy-mail.py den Ausgang leeren kann
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ACADEMY_URL: https://academy.biber.solar
      ACADEMY_DATA: /data
      ACADEMY_ADMINS: ${ACADEMY_ADMINS}
      ACADEMY_WHATSAPP_CHANNEL: ${ACADEMY_WHATSAPP_CHANNEL:-}
    volumes:
      - ./data:/data
    networks:
      - proxy_default
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:                           # Docker-Log begrenzen: höchstens 3 × 10 MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy_default:
    external: true
