# Statische Auslieferung der Hauptseite biber.solar (im Container biber-solar)
# Sprache: Wer die Startseite «/» aufruft, bekommt Deutsch, wenn die bevorzugte Browsersprache Deutsch ist (de, de-CH,
# gsw …), sonst die englische Fassung /en/. Ohne Accept-Language (z. B. Suchmaschinen) bleibt es Deutsch. Kein Cookie:
# wer umschaltet, landet über die Umschalter-Links direkt auf index.html bzw. en/ und wird nicht mehr umgeleitet.
map $http_accept_language $sprache_en {
    default         1;
    ""              0;
    "~*^\s*(de|gsw)" 0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;     # Umleitungen relativ (sonst http:// hinter dem Proxy)

    # .git, .github, .gitignore usw. nie ausliefern
    location ~ /\. { return 404; }

    location = / {
        add_header Vary "Accept-Language";
        if ($sprache_en) { return 302 /en/; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
