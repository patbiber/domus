# Rollen der beiden Rechner (wird von allen reserve/*.sh gelesen und vom Abgleich auf die Reserve kopiert).
# HAUPT_IP: feste Adresse des Hauptrechners (heute der NUC «domus»), RESERVE_IP: feste Adresse der Reserve («domus2»),
# VIP: die gemeinsame Adresse, an die der Router 80/443 weiterleitet und die alle Geräte als DNS fragen.
# Rollen tauschen (z. B. NUC kaputt, domus2 wird Hauptrechner, neuer domus3 wird Reserve): Adressen hier ändern, dann
# auf dem neuen Hauptrechner  reserve/rolle-einrichten.sh haupt  und auf der neuen Reserve  reserve/rolle-einrichten.sh reserve
# Ändert sich RESERVE_IP, auch den zweiten DNS anpassen: pihole/compose.yml (dns-server) und pihole-zweit/compose.yml.
HAUPT_IP=192.168.1.20
RESERVE_IP=192.168.1.24
VIP=192.168.1.23
DEV=eno1
ROUTER_IP=192.168.1.1
# Reserve nur über Mittag (reserve/mittag.sh, jede Minute auf dem Hauptrechner): wecht sie im Fenster per Wake-on-LAN
# (RESERVE_MAC) und fährt sie danach herunter – ausser der Knopf «Reserve Server On» in homi (home.biber.solar) ist aktiv.
RESERVE_MAC=6c:4b:90:3d:59:20
FENSTER_VON=12:00
FENSTER_BIS=12:30
